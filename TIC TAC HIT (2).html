<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>TIC TAC HIT</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#000;--ink:#fff;--g1:#00f87a;--g2:#22d65f;--g3:#3dc400;--card:#0d0d0d;--line:#fff;
--font:"More Sugar","Fredoka","Trebuchet MS",sans-serif;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:dark}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#000;--ink:#fff}}
:root[data-theme="dark"]{--bg:#000;--ink:#fff}
*{box-sizing:border-box}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:var(--font);display:flex;justify-content:center;overflow-x:hidden}
.app{width:100%;max-width:480px;min-height:100dvh;padding:16px 20px 24px;display:flex;flex-direction:column;align-items:center;gap:16px;position:relative}
.arc{position:absolute;border:14px solid var(--ink);border-radius:50%;pointer-events:none;opacity:.12}
.arc.a{width:420px;height:420px;right:-250px;top:60px;border-left-color:transparent;border-bottom-color:transparent}
.arc.b{width:420px;height:420px;left:-250px;bottom:40px;border-right-color:transparent;border-top-color:transparent}
.logo{width:min(46vw,190px);height:auto;margin-top:4px}
.screen{width:100%;flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;text-align:center;position:relative;z-index:1}
.hidden{display:none!important}
h1{margin:0;font-size:2.6rem;line-height:1;color:var(--g2);letter-spacing:.02em}
p.sub{margin:0;font-size:1.1rem;color:#cfcfcf;max-width:30ch;line-height:1.35}
button,.btn{font-family:var(--font);font-size:1.35rem;font-weight:700;border:0;border-radius:999px;padding:16px 34px;cursor:pointer;text-decoration:none;display:inline-block;color:#000;background:var(--g1);box-shadow:0 6px 0 var(--g3);transition:transform .08s,box-shadow .08s}
button:active,.btn:active{transform:translateY(5px);box-shadow:0 1px 0 var(--g3)}
button.ghost{background:transparent;color:var(--ink);box-shadow:inset 0 0 0 3px var(--ink)}
button:focus-visible,.btn:focus-visible{outline:3px solid var(--ink);outline-offset:3px}
.dial{width:min(72vw,290px);aspect-ratio:1;border-radius:50%;background:#000;border:12px solid var(--ink);display:flex;align-items:center;justify-content:center;position:relative}
.dial::before{content:"";position:absolute;inset:14px;border-radius:50%;border:5px solid var(--g2);opacity:.5}
.dial .word{font-size:clamp(1.7rem,9vw,2.4rem);line-height:1.05;color:var(--g1);padding:0 18px;overflow-wrap:anywhere}
.dial.spin .word{animation:blink .12s steps(2) infinite}
@keyframes blink{50%{opacity:.35}}
.dial.land{animation:pop .35s cubic-bezier(.3,1.6,.5,1)}
@keyframes pop{from{transform:scale(.85)}to{transform:scale(1)}}
.hint{font-size:1.05rem;color:#cfcfcf;margin:0;min-height:1.4em}
.cam{width:100%;max-width:360px;aspect-ratio:1;border-radius:28px;overflow:hidden;border:6px solid var(--g2);position:relative;background:#111}
.cam video{width:100%;height:100%;object-fit:cover}
.cam::after{content:"";position:absolute;inset:18%;border:4px solid var(--g1);border-radius:18px}
.row{display:flex;flex-wrap:wrap;gap:14px;justify-content:center}
.err{color:#ffb4b4;font-size:1rem;max-width:32ch;margin:0}
@media (prefers-reduced-motion:reduce){.dial.spin .word,.dial.land{animation:none}}
</style>
</head>

  <section id="home" class="screen">
    <h1>TIC TAC HIT</h1>
    <p class="sub">Escucha, escanea y demuestra cuánto sabes de música.</p>
    <button id="start">¡Jugar!</button>
  </section>

  <section id="play" class="screen hidden">
    <div id="dial" class="dial"><span id="word" class="word">?</span></div>
    <p id="hint" class="hint"></p>
    <div id="camWrap" class="cam hidden"><video id="video" playsinline muted></video></div>
    <p id="err" class="err hidden"></p>
    <div class="row">
      <button id="scan">Escanear QR</button>
      <a id="open" class="btn hidden" href="#" target="_blank" rel="noopener">Abrir en Spotify</a>
      <button id="photo" class="hidden">Hacer foto al QR</button>
      <input id="file" type="file" accept="image/*" capture="environment" class="hidden">
      <button id="next" class="ghost">Siguiente</button>
    </div>
  </section>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jsQR/1.4.0/jsQR.min.js"></script>
<script>
const OPTIONS=["Canta!","Canción","Artista / grupo","Álbum","Año"];
const $=id=>document.getElementById(id);
let stream=null,scanning=false,spinTimer=null;

function randIndex(n){
  try{const a=new Uint32Array(1),lim=Math.floor(4294967296/n)*n;
    do{crypto.getRandomValues(a)}while(a[0]>=lim);return a[0]%n}
  catch(e){return Math.floor(Math.random()*n)}
}
function stopCam(){
  scanning=false;
  if(stream){stream.getTracks().forEach(t=>t.stop());stream=null}
  $("camWrap").classList.add("hidden");
}
function draw(){
  stopCam();
  $("open").classList.add("hidden");$("err").classList.add("hidden");
  $("scan").classList.remove("hidden");$("scan").textContent="Escanear QR";$("photo").classList.add("hidden");
  $("hint").textContent="";
  const dial=$("dial"),word=$("word");
  dial.classList.remove("land");dial.classList.add("spin");
  clearInterval(spinTimer);
  spinTimer=setInterval(()=>{word.textContent=OPTIONS[randIndex(5)]},110);
  setTimeout(()=>{
    clearInterval(spinTimer);
    word.textContent=OPTIONS[randIndex(5)];
    dial.classList.remove("spin");void dial.offsetWidth;dial.classList.add("land");
    $("hint").textContent="Escanea el QR de la carta y escucha.";
  },900);
}
function showErr(m){const e=$("err");e.textContent=m;e.classList.remove("hidden")}
function found(url){
  stopCam();
  $("scan").classList.add("hidden");
  $("photo").classList.add("hidden");$("err").classList.add("hidden");$("open").href=url;$("open").classList.remove("hidden");
  $("hint").textContent="¡Listo! Toca para escuchar la canción.";
}
function validSpotify(t){return /^https?:\/\/(open\.spotify\.com|spotify\.link)\//i.test(t)}
async function startScan(){
  $("err").classList.add("hidden");
  try{
    stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:"environment"}},audio:false});
  }catch(e){
    showErr("La cámara en directo no está disponible aquí. Haz una foto al QR con el botón de abajo.");$("photo").classList.remove("hidden");return;
  }
  const v=$("video");v.srcObject=stream;await v.play();
  $("camWrap").classList.remove("hidden");$("scan").classList.add("hidden");
  $("hint").textContent="Apunta la cámara al código QR.";
  scanning=true;
  const cv=document.createElement("canvas"),cx=cv.getContext("2d",{willReadFrequently:true});
  let det=null;try{if("BarcodeDetector" in window)det=new BarcodeDetector({formats:["qr_code"]})}catch(e){}
  const tick=async()=>{
    if(!scanning)return;
    if(v.readyState>=2&&v.videoWidth){
      let text=null;
      try{
        if(det){const r=await det.detect(v);if(r.length)text=r[0].rawValue}
        else{
          cv.width=v.videoWidth;cv.height=v.videoHeight;cx.drawImage(v,0,0);
          const d=cx.getImageData(0,0,cv.width,cv.height);
          const c=window.jsQR&&jsQR(d.data,d.width,d.height,{inversionAttempts:"attemptBoth"});
          if(c)text=c.data;
        }
      }catch(e){}
      if(text){
        if(validSpotify(text)){found(text);return}
        $("hint").textContent="Ese QR no es de una canción de Spotify.";
      }
    }
    requestAnimationFrame(tick);
  };
  tick();
}
$("start").onclick=()=>{$("home").classList.add("hidden");$("play").classList.remove("hidden");draw()};
$("next").onclick=draw;
$("scan").onclick=startScan;
$("photo").onclick=()=>$("file").click();
$("file").onchange=e=>{
  const f=e.target.files[0];if(!f)return;
  const rd=new FileReader();
  rd.onload=()=>{
    const img=new Image();
    img.onload=()=>{
      const s=Math.min(1,1400/Math.max(img.width,img.height));
      const cv=document.createElement("canvas");cv.width=Math.round(img.width*s);cv.height=Math.round(img.height*s);
      const cx=cv.getContext("2d");cx.drawImage(img,0,0,cv.width,cv.height);
      const d=cx.getImageData(0,0,cv.width,cv.height);
      const c=window.jsQR&&jsQR(d.data,d.width,d.height,{inversionAttempts:"attemptBoth"});
      if(c&&validSpotify(c.data))found(c.data);
      else showErr("No he podido leer el QR. Haz otra foto más cerca y con buena luz.");
    };
    img.src=rd.result;
  };
  rd.readAsDataURL(f);e.target.value="";
};
</script>
</body>
</html>
